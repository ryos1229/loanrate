<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>準備中 - 住宅ローン金利ダッシュボード</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #020617;
            font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            overflow: hidden;
        }

        .bg {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 50% 0%, rgba(59, 130, 246, 0.15) 0%, transparent 70%),
                radial-gradient(ellipse 60% 50% at 80% 100%, rgba(99, 102, 241, 0.1) 0%, transparent 60%);
        }

        .card {
            position: relative;
            text-align: center;
            padding: 60px 48px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            max-width: 480px;
            width: 90%;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
            animation: fadeUp 0.8s ease both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon {
            font-size: 48px;
            margin-bottom: 24px;
            animation: spin 6s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        h1 {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, #60a5fa, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }

        p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 15px;
            line-height: 1.8;
        }

        .dot {
            display: inline-flex;
            gap: 6px;
            margin-top: 36px;
        }

        .dot span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3b82f6;
            animation: bounce 1.4s ease-in-out infinite;
        }

        .dot span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.4;
            }

            40% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="bg"></div>
    <div class="card">
        <div class="icon">⚙️</div>
        <h1>準備中</h1>
        <p>
            住宅ローン金利ダッシュボードは<br>
            現在アップデート作業中です。<br><br>
            しばらくお待ちください。
        </p>
        <div class="dot">
            <span></span><span></span><span></span>
        </div>
    </div>
</body>

</html>
